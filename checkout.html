<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout - LARANJODINA STORE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header class="main-header">
        <div class="container">
            <div class="logo">
                <a href="index.html">
                    <img src="./img/LOGOSITE.png" alt="Logo LARANJODINA STORE" />
                </a>
            </div>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Início</a></li>
                    <li><a href="produtos.html">Produtos</a></li>
                    <li><a href="sobre.html">Sobre</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="checkout-wrapper">
                <h1>Finalizar Compra</h1>
                <div class="checkout-layout">
                    <section class="checkout-form">
                        <form id="payment-form" action="https://formspree.io/f/xxxxxxxx" method="POST">
                            <fieldset>
                                <legend>Dados Pessoais</legend>
                                <div class="form-group">
                                    <label for="name">Nome Completo</label>
                                    <input type="text" id="name" name="Nome do Cliente" required />
                                </div>
                                <div class="form-group">
                                    <label for="email">E-mail</label>
                                    <input type="email" id="email" name="Email do Cliente" required />
                                </div>
                            </fieldset>

                            <fieldset>
                                <legend>Endereço de Entrega</legend>
                                <div class="form-group">
                                    <label for="cep">CEP</label>
                                    <input type="text" id="cep" name="CEP" required />
                                </div>
                                <div class="form-group">
                                    <label for="address">Rua e Número</label>
                                    <input type="text" id="address" name="Endereço" required />
                                </div>
                                <div class="form-group">
                                    <label for="city">Cidade</label>
                                    <input type="text" id="city" name="Cidade" required />
                                </div>
                                <div class="form-group">
                                    <label for="state">Estado</label>
                                    <input type="text" id="state" name="Estado" required />
                                </div>
                            </fieldset>

                            <input type="hidden" name="Produto Comprado" id="hidden-product-name">
                            <input type="hidden" name="Valor Total" id="hidden-total-price" value="R$ 99,99">

                            <button type="submit" class="cta-button">
                                Finalizar Pagamento
                            </button>
                        </form>
                    </section>

                    <aside class="order-summary">
                        <h2>Resumo do Pedido</h2>
                        <div class="summary-items" id="summary-items">
                            </div>
                        <div class="summary-total">
                            <p><span>Subtotal:</span> <span>R$ 89,99</span></p>
                            <p><span>Frete:</span> <span>R$ 10,00</span></p>
                            <p class="total">
                                <strong>Total:</strong> <strong>R$ 99,99</strong>
                            </p>
                        </div>
                    </aside>
                </div>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>&copy; 2025 LARANJODINA STORE. Todos os direitos reservados.</p>
        </div>
    </footer>
    <script src="checkout.js"></script>
</body>
</html>
